name: Klotski readiness verification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: klotski-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare web and QA sources with verified baseline
        id: web
        run: |
          git fetch --depth=1 origin 1275fb816b99913242923456ab4366d1763aab75
          if git diff --quiet 1275fb816b99913242923456ab4366d1763aab75 HEAD -- index.html vendor/ tests/ package.json package-lock.json; then
            echo 'replay=false' >> "$GITHUB_OUTPUT"
            echo 'Exact web/QA sources match green browser run 43409193383; reusing its evidence.'
          else
            echo 'replay=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.web.outputs.replay == 'true'
        with:
          node-version: '22'
      - if: steps.web.outputs.replay == 'true'
        run: npm ci --ignore-scripts
      - if: steps.web.outputs.replay == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.web.outputs.replay == 'true'
        run: npm run test:state
      - if: steps.web.outputs.replay == 'true'
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always() && steps.web.outputs.replay == 'true'
        with:
          name: klotski-browser-evidence
          path: qa-results/

  android-preparation:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p android :app:assembleDebug :app:bundleRelease :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: klotski-android-preparation
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
