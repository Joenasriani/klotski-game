name: Klotski Android store captures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/store-assets.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/store-assets.yml']
permissions:
  contents: read
concurrency:
  group: klotski-store-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint app plus test driver
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease :app:lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.joenasr.klotski.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-result.txt
            grep -q 'OK (1 test)' instrumentation-result.txt
            adb pull /sdcard/Android/data/com.joenasr.klotski/files/store-screens store-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klotski-store-android-evidence
          path: |
            instrumentation-result.txt
            store-screens/
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
